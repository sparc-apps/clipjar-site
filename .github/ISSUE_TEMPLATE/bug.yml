name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Please don't paste passwords or other private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipJar version
      description: Mac — ClipJar → About; iPhone/iPad — at the bottom of Settings.
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Mac, iPhone, iPad]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS / iOS version
      placeholder: "macOS 26.1"
