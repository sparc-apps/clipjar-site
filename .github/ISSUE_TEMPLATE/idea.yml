name: Idea
description: Suggest an improvement
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like ClipJar to do, and how would it help you?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options: [Mac, iPhone, iPad]
